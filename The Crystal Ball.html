<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Crystal Ball</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#4a3a85;--bg2:#231552;--ink:#efe7ff;--gold:#e6c27a;--gold2:#8a6a2c;--glow:150,110,255;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a55;--bg2:#0d0626}}
:root[data-theme="dark"]{--bg1:#2a1a55;--bg2:#0d0626}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff9,transparent),radial-gradient(1px 1px at 150px 20px,#fffc,transparent),radial-gradient(1px 1px at 60px 100px,#fff7,transparent);background-size:180px 120px;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.9}}
h1{font:500 clamp(14px,3.4vw,18px)/1 Cinzel,Georgia,serif;letter-spacing:.45em;text-transform:uppercase;margin:0;color:var(--gold);text-indent:.45em;position:relative}
.wrap{--d:clamp(220px,min(78vw,50vh),360px);width:var(--d);position:relative;touch-action:none;cursor:grab}
.wrap:active{cursor:grabbing}
#drag{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#drag.live{transition:none}
.stage.shaking{animation:shake 1.2s ease-in-out}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-14px,-6px) rotate(-5deg)}22%{transform:translate(16px,5px) rotate(5deg)}34%{transform:translate(-16px,-4px) rotate(-6deg)}46%{transform:translate(15px,6px) rotate(5deg)}58%{transform:translate(-10px,-3px) rotate(-4deg)}72%{transform:translate(8px,2px) rotate(3deg)}86%{transform:translate(-3px,0) rotate(-1deg)}}
.ball{width:var(--d);height:var(--d);border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 62%,#41308a,#1a0d42 62%,#07031a);box-shadow:0 0 70px rgba(var(--glow),.5),0 0 140px rgba(var(--glow),.25),inset 0 0 50px rgba(190,160,255,.4),inset 0 -20px 40px rgba(0,0,0,.5);animation:pulse 4s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 60px rgba(var(--glow),.4),0 0 120px rgba(var(--glow),.2),inset 0 0 50px rgba(190,160,255,.35),inset 0 -20px 40px rgba(0,0,0,.5)}to{box-shadow:0 0 85px rgba(var(--glow),.65),0 0 160px rgba(var(--glow),.3),inset 0 0 55px rgba(190,160,255,.5),inset 0 -20px 40px rgba(0,0,0,.5)}}
.m{position:absolute;width:75%;height:75%;border-radius:50%;filter:blur(24px);opacity:.75;--spd:14s;animation:drift var(--spd) linear infinite}
.m1{background:radial-gradient(circle,#9b6bff,transparent 68%);top:-10%;left:-12%}
.m2{background:radial-gradient(circle,#2fd3c4,transparent 68%);bottom:-15%;right:-10%;animation-direction:reverse;--spd:19s}
.m3{background:radial-gradient(circle,#e24fb5,transparent 68%);top:25%;left:30%;--spd:23s}
@keyframes drift{0%{transform:rotate(0) translateX(18%) rotate(0)}100%{transform:rotate(360deg) translateX(18%) rotate(-360deg)}}
.churn .m{--spd:1.1s;opacity:1}
.glass::before{content:"";position:absolute;top:5%;left:14%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));transform:rotate(-22deg);filter:blur(1px);z-index:3;pointer-events:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 90%,rgba(255,255,255,.22),transparent 30%);z-index:3;pointer-events:none}
.fortune{position:absolute;inset:15%;display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;font-weight:500;font-size:calc(var(--d)*.062);line-height:1.22;z-index:2;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.85),0 0 26px rgba(var(--glow),.9);opacity:.55;filter:blur(0);transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease}
.fortune.long{font-size:calc(var(--d)*.052)}
.fortune.hide{opacity:0;filter:blur(8px);transform:scale(.9)}
.fortune.show{opacity:1}
.spark{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,230,160,.9);z-index:2;animation:sp 1.3s ease-out forwards}
@keyframes sp{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.base{width:60%;height:calc(var(--d)*.17);margin:-7% auto 0;position:relative;z-index:-1;background:linear-gradient(90deg,var(--gold2),var(--gold) 35%,#fff2c4 50%,var(--gold) 65%,var(--gold2));clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.base::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.4))}
.hint{margin:0;font-style:italic;font-size:1.05rem;opacity:.8;text-align:center;padding:0 1.5rem;position:relative}
button{font:500 .85rem Cinzel,Georgia,serif;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--gold);border-radius:999px;padding:.85rem 1.8rem;cursor:pointer;position:relative;transition:background .2s,box-shadow .2s}
button:hover,button:focus-visible{background:rgba(230,194,122,.2);box-shadow:0 0 22px rgba(230,194,122,.35);outline:none}
@media (prefers-reduced-motion:reduce){.stage.shaking{animation:none}.m,.ball,body::before{animation:none}}
</style>
</head>
<body>
<h1>The Oracle</h1>
<div class="wrap" id="wrap" aria-label="Crystal ball. Drag it back and forth, or tap, to shake.">
  <div id="drag"><div class="stage" id="stage">
    <div class="ball glass" id="ball">
      <div class="m m1"></div><div class="m m2"></div><div class="m m3"></div>
      <div class="fortune" id="fortune" aria-live="polite">Hold a question in your mind&hellip; then shake.</div>
    </div>
  </div></div>
  <div class="base"></div>
</div>
<p class="hint" id="hint">Drag the orb back and forth, tap it, or shake your device.</p>
<button id="btn" type="button">Shake the ball</button>

<script>
const F=[
"The universe has read your question and is taking notes.",
"Yes—but not in the way you’re hoping.",
"A door will open. Check whether it was already unlocked.",
"Someone you’ve forgotten is thinking of you. Briefly.",
"You will find what you lost in the last place you looked, obviously.",
"The answer is in a drawer you haven’t opened since spring.",
"Trust the second idea, not the first.",
"Mercury is not in retrograde. You simply made a poor decision.",
"Fog in the forecast. Proceed by candlelight.",
"The stars say yes. The stars are not accountable for outcomes.",
"A small kindness today will return wearing a disguise.",
"Do not ask again. The answer has already left the room.",
"Your luck is warming up in the next room.",
"An old key still fits a lock you’ve forgotten.",
"Beware of a bargain wrapped in velvet.",
"The thing you’re avoiding is smaller than its shadow.",
"Ask me again after tea.",
"Signs point to yes, with a footnote.",
"A stranger will say something that rearranges your week.",
"The moon has your answer. She’s just being dramatic about it.",
"What you seek is also seeking you. Awkward, really.",
"Your future is bright, slightly damp, and smells of rain.",
"Not today. But the day after has promise.",
"Make the thing. Worry about the audience later.",
"The oracle is out of office. Please leave an offering.",
"A secret you’re keeping is growing restless.",
"Follow the smallest light, not the loudest.",
"You already know. You’re just collecting second opinions.",
"Expect a letter, a sign, or a very persuasive pigeon.",
"The tide turns when you stop watching it.",
"Something ends this week so something odder can begin.",
"Wear the bold thing. Fortune favors the well-dressed.",
"Outlook hazy—which, honestly, describes most outlooks.",
"A long road ends at an unexpectedly good sandwich.",
"Silence is also an answer. A rude one, but still.",
"Three coincidences make a pattern. You’re at two.",
"The ink isn’t dry on this one. Smudge accordingly."
];
const $=id=>document.getElementById(id);
const stage=$('stage'),ball=$('ball'),fortune=$('fortune'),drag=$('drag'),wrap=$('wrap'),hint=$('hint');
let bag=[],busy=false,last=-1;
function pick(){
  if(!bag.length){bag=F.map((_,i)=>i).sort(()=>Math.random()-.5);if(bag[bag.length-1]===last)bag.reverse();}
  last=bag.pop();return F[last];
}
function sparkle(){
  const r=ball.clientWidth/2;
  for(let i=0;i<16;i++){
    const s=document.createElement('span'),a=Math.random()*6.283,d=r*(.3+Math.random()*.55);
    s.className='spark';
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.animationDelay=(Math.random()*.5)+'s';
    ball.appendChild(s);setTimeout(()=>s.remove(),2000);
  }
}
function shake(){
  if(busy)return;busy=true;
  try{navigator.vibrate&&navigator.vibrate([60,40,60,40,90]);}catch(e){}
  fortune.className='fortune hide';
  ball.classList.add('churn');
  stage.classList.remove('shaking');void stage.offsetWidth;stage.classList.add('shaking');
  sparkle();
  hint.textContent='The mists are gathering…';
  setTimeout(()=>{
    const t=pick();
    fortune.textContent=t;
    fortune.className='fortune show'+(t.length>62?' long':'');
    ball.classList.remove('churn');
    hint.textContent='Shake again to ask another question.';
  },1250);
  setTimeout(()=>{stage.classList.remove('shaking');busy=false;},1500);
}
/* pointer shake: drag back and forth, or tap */
let down=false,lx=0,sx=0,dir=0,rev=0,lastRev=0,moved=0;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.base'))return;
  down=true;lx=sx=e.clientX;dir=0;rev=0;moved=0;drag.classList.add('live');
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
});
wrap.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-lx;moved=Math.max(moved,Math.abs(e.clientX-sx));
  drag.style.transform='translateX('+Math.max(-40,Math.min(40,e.clientX-sx))+'px) rotate('+Math.max(-6,Math.min(6,(e.clientX-sx)/8))+'deg)';
  if(Math.abs(dx)>7){
    const d=dx>0?1:-1,now=performance.now();
    if(d!==dir&&dir!==0){rev=(now-lastRev<700)?rev+1:1;lastRev=now;}
    dir=d;lx=e.clientX;
    if(rev>=4){rev=0;shake();}
  }
});
function up(){
  if(!down)return;down=false;
  drag.classList.remove('live');drag.style.transform='';
  if(moved<6)shake();
}
wrap.addEventListener('pointerup',up);
wrap.addEventListener('pointercancel',()=>{down=false;drag.classList.remove('live');drag.style.transform='';});
/* device shake */
let motionOn=false,lm=null,lastShake=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a)return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0);
  if(lm!==null&&Math.abs(m-lm)>16&&performance.now()-lastShake>1800){lastShake=performance.now();shake();}
  lm=m;
}
async function enableMotion(){
  if(motionOn||typeof DeviceMotionEvent==='undefined')return;
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')return;
    }
    window.addEventListener('devicemotion',onMotion);motionOn=true;
  }catch(e){}
}
$('btn').addEventListener('click',()=>{enableMotion();shake();});
if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission!=='function'){enableMotion();}
</script>
</body>
</html>
